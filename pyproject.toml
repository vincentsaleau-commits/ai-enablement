[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ticket-rag"
version = "0.1.0"
description = "Local Ollama RAG for support ticket suggestions with mandatory human review"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["support_rag*"]

[tool.coverage.run]
source = ["support_rag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true